name: RRFA Fork CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rrfa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop patch gate
    if: github.repository == 'scottdominguez/buzz'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - run: pnpm install --frozen-lockfile
      - name: Focused RRFA regressions
        working-directory: desktop
        run: >-
          node --import ./test-loader.mjs --experimental-strip-types --test
          src/features/messages/ui/conversationVirtualization.test.mjs
          src/features/messages/lib/mentionProfileLookup.test.mjs
      - name: Desktop tests
        run: pnpm --dir desktop test
      - name: TypeScript
        run: pnpm --dir desktop typecheck
      - name: Biome
        working-directory: desktop
        run: >-
          pnpm exec biome check
          src/features/home/ui/InboxDetailPane.tsx
          src/features/messages/ui/MessageThreadPanel.tsx
          src/features/messages/useThreadReplies.ts
          src/features/messages/ui/conversationVirtualization.ts
          src/features/messages/ui/conversationVirtualization.test.mjs
          src/features/messages/lib/useMentions.ts
          src/features/messages/lib/mentionProfileLookup.ts
          src/features/messages/lib/mentionProfileLookup.test.mjs
      - name: Production build
        run: pnpm --dir desktop build

  windows-rust:
    name: Windows Rust gate
    if: github.repository == 'scottdominguez/buzz'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          key: rrfa-windows-msvc
          save-if: false
      - name: Create sidecar placeholders
        shell: bash
        env:
          TARGET: x86_64-pc-windows-msvc
        run: |
          mkdir -p desktop/src-tauri/binaries
          for bin in buzz-acp buzz-agent buzz-dev-mcp git-credential-nostr buzz; do
            touch "desktop/src-tauri/binaries/${bin}-${TARGET}.exe"
          done
      - name: Tauri Rust check
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml --workspace --all-targets --target x86_64-pc-windows-msvc
